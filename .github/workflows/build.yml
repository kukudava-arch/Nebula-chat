name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать проект
        run: |
          Z=$(ls *.zip | head -n1)
          echo "Архив: $Z"
          mkdir src
          unzip -q "$Z" -d src
          ls src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android-проект
        working-directory: src/app
        run: |
          flutter create --platforms=android --org com.nebula --project-name nebula_chat .
          rm -rf test
          python3 ../tools/patch_android.py
      - working-directory: src/app
        run: flutter pub get
      - working-directory: src/app
        run: flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-chat-apk
          path: src/app/build/app/outputs/flutter-apk/app-release.apk
